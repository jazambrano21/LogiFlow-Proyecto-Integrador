# ─── Base de datos en memoria (H2) ───────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb_pedidos;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ─── JWT mínimo para tests ────────────────────────────────────────────────────
jwt.secret=test-secret-key-for-unit-testing-only-32chars

# ─── Deshabilitar RabbitMQ completamente en tests ────────────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# ─── Placeholders para que Spring no falle al resolver propiedades ────────────
rabbitmq.exchange=logistica.topic
rabbitmq.routing-key.pedido-creado=pedido.creado
rabbitmq.routing-key.pedido-cancelado=pedido.cancelado
