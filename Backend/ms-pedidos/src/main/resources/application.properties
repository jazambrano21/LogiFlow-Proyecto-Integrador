spring.application.name=ms-pedidos
server.port=${PORT:8083}

# Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3312/ms_pedidos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:logiflow-secret-key-fase2-must-be-at-least-32-chars}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:logiflow}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:logiflow2026}

# Nombres de exchange y routing keys
rabbitmq.exchange=logistica.topic
rabbitmq.routing-key.pedido-creado=pedido.creado
rabbitmq.routing-key.pedido-cancelado=pedido.cancelado

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
