spring.application.name=ms-ruteo
server.port=${PORT:8085}

# Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3313/ms_ruteo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:logiflow-secret-key-fase2-must-be-at-least-32-chars}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:logiflow}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:logiflow2026}

# Nombres de colas y exchange
rabbitmq.exchange=logistica.topic
rabbitmq.queue.pedido-creado=q.ruteo.pedido-creado
rabbitmq.routing-key.envio-asignado=envio.asignado
rabbitmq.routing-key.pedido-entregado=pedido.entregado

# URL de ms-flota-rest
ms-flota.base-url=${MS_FLOTA_URL:http://localhost:8080}

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
