version: "3.9"

services:
  mysql-ruteo:
    image: mysql:8.0
    container_name: mysql-ruteo
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ms_ruteo_db
    ports:
      - "3313:3306"
    volumes:
      - mysql_ruteo_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_ruteo_data:
