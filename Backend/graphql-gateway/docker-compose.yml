version: "3.9"

# docker-compose individual para desarrollo local de graphql-gateway
# Requiere que los microservicios REST estén corriendo en localhost

services:
  graphql-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphql-gateway
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MS_AUTH_URL: http://host.docker.internal:8081
      MS_CLIENTES_URL: http://host.docker.internal:8082
      MS_PEDIDOS_URL: http://host.docker.internal:8083
      MS_FLOTA_URL: http://host.docker.internal:8080
      MS_RUTEO_URL: http://host.docker.internal:8085
      MS_SEGUIMIENTO_WS_URL: http://host.docker.internal:3005
    extra_hosts:
      - "host.docker.internal:host-gateway"
