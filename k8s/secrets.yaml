# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANTE: Este archivo contiene valores de ejemplo en base64.
# En producción usa kubectl create secret o un gestor como Sealed Secrets / Vault.
# Generar: echo -n "valor" | base64
#
# Valores actuales (base64):
#   logiflow-secret-key-fase2-must-be-at-least-32-chars
#     → bG9naWZsb3ctc2VjcmV0LWtleS1mYXNlMi1tdXN0LWJlLWF0LWxlYXN0LTMyLWNoYXJz
#   root → cm9vdA==
#   logiflow → bG9naWZsb3c=
#   logiflow2026 → bG9naWZsb3cyMDI2
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: logiflow-secrets
  namespace: logiflow
type: Opaque
data:
  JWT_SECRET: bG9naWZsb3ctc2VjcmV0LWtleS1mYXNlMi1tdXN0LWJlLWF0LWxlYXN0LTMyLWNoYXJz
  DB_PASSWORD: cm9vdA==
  DB_USERNAME: cm9vdA==
  RABBITMQ_USERNAME: bG9naWZsb3c=
  RABBITMQ_PASSWORD: bG9naWZsb3cyMDI2
