apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-auth
  namespace: logiflow
  labels:
    app: ms-auth
    app.kubernetes.io/part-of: logiflow
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-auth
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ms-auth
        version: "1.0"
    spec:
      containers:
        - name: ms-auth
          # La imagen se actualiza automáticamente por el pipeline CI/CD
          image: ghcr.io/jazambrano21/logiflow/ms-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: ms-auth-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: logiflow-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logiflow-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: logiflow-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /auth/verify
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /auth/verify
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
