apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-clientes
  namespace: logiflow
  labels:
    app: ms-clientes
    app.kubernetes.io/part-of: logiflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-clientes
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ms-clientes
    spec:
      containers:
        - name: ms-clientes
          image: ghcr.io/jazambrano21/logiflow/ms-clientes:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              name: http
          envFrom:
            - configMapRef:
                name: ms-clientes-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: logiflow-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logiflow-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: logiflow-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /clientes
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /clientes
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
