name: CI Pipeline - LogiFlow Fase 2

on:
  push:
    branches: [main, development]
    paths:
      - 'Backend/ms-flota/**'
      - 'Backend/ms-taller/**'
      - 'Backend/ms-auth/**'
      - 'Backend/ms-clientes/**'
      - 'Backend/ms-pedidos/**'
      - 'Backend/ms-ruteo/**'
      - 'Backend/ms-seguimiento/**'
      - 'Backend/graphql-gateway/**'
      - '.github/workflows/logiflow.yml'
      - 'sonar-project.properties'
      - 'docker-compose.yml'
      - 'rabbitmq/**'
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main, development]
    paths:
      - 'Backend/ms-flota/**'
      - 'Backend/ms-taller/**'
      - 'Backend/ms-auth/**'
      - 'Backend/ms-clientes/**'
      - 'Backend/ms-pedidos/**'
      - 'Backend/ms-ruteo/**'
      - 'Backend/ms-seguimiento/**'
      - 'Backend/graphql-gateway/**'
      - '.github/workflows/logiflow.yml'
      - 'sonar-project.properties'
      - 'docker-compose.yml'
      - 'rabbitmq/**'

permissions:
  contents: read

jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Build + test de microservicios Java (matrix)
  # Fase 1: ms-flota, ms-taller  → MySQL real via Docker Compose
  # Fase 2: ms-auth, ms-clientes, ms-pedidos, ms-ruteo → H2 en memoria
  # ══════════════════════════════════════════════════════════════════════════
  build_test_java:
    name: Build y test Java — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Fase 1 ──────────────────────────────────────────────────────
          - service: ms-flota
            db_service: mysql-flota
            db_port: 3307
            db_name: ms_flota_db
            datasource_url: jdbc:mysql://localhost:3307/ms_flota_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            spring_profile: ""

          - service: ms-taller
            db_service: mysql-taller
            db_port: 3309
            db_name: logiflow_taller
            datasource_url: jdbc:mysql://localhost:3309/logiflow_taller?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            spring_profile: ""

          # ── Fase 2 — H2 en memoria (perfil test) ────────────────────────
          - service: ms-auth
            db_service: ""
            db_port: 0
            db_name: ""
            datasource_url: ""
            spring_profile: "test"

          - service: ms-clientes
            db_service: ""
            db_port: 0
            db_name: ""
            datasource_url: ""
            spring_profile: "test"

          - service: ms-pedidos
            db_service: ""
            db_port: 0
            db_name: ""
            datasource_url: ""
            spring_profile: "test"

          - service: ms-ruteo
            db_service: ""
            db_port: 0
            db_name: ""
            datasource_url: ""
            spring_profile: "test"

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Levantar base de datos MySQL
        if: ${{ matrix.db_service != '' }}
        working-directory: Backend/${{ matrix.service }}
        run: docker compose up -d ${{ matrix.db_service }}

      - name: Esperar que MySQL esté listo
        if: ${{ matrix.db_service != '' }}
        working-directory: Backend/${{ matrix.service }}
        run: |
          echo "Esperando MySQL en puerto ${{ matrix.db_port }}..."
          for i in {1..30}; do
            docker compose ps ${{ matrix.db_service }} | grep "healthy" && echo "MySQL listo" && break
            echo "Intento $i/30..."
            sleep 5
          done

      - name: Dar permisos a Maven Wrapper
        working-directory: Backend/${{ matrix.service }}
        run: chmod +x mvnw

      # Fase 1 — MySQL real
      - name: Compilar y testear (MySQL)
        if: ${{ matrix.db_service != '' }}
        working-directory: Backend/${{ matrix.service }}
        run: ./mvnw -B clean verify
        env:
          SPRING_DATASOURCE_URL: ${{ matrix.datasource_url }}
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      # Fase 2 — H2 en memoria
      - name: Compilar y testear (H2 - perfil test)
        if: ${{ matrix.db_service == '' }}
        working-directory: Backend/${{ matrix.service }}
        run: ./mvnw -B clean verify -Dspring.profiles.active=test
        env:
          JWT_SECRET: test-secret-key-for-ci-pipeline-32chars

      - name: Bajar containers
        if: ${{ always() && matrix.db_service != '' }}
        working-directory: Backend/${{ matrix.service }}
        run: docker compose down -v

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2 — Build + test de microservicios Node.js
  # ms-seguimiento, graphql-gateway
  # ══════════════════════════════════════════════════════════════════════════
  build_test_node:
    name: Build y test Node — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ms-seguimiento
          - service: graphql-gateway

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/${{ matrix.service }}/package-lock.json

      - name: Instalar dependencias
        working-directory: Backend/${{ matrix.service }}
        run: npm ci --omit=dev

      - name: Verificar sintaxis JS
        working-directory: Backend/${{ matrix.service }}
        run: |
          find src -name "*.js" -exec node --check {} \;
          echo "Sintaxis verificada correctamente"

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 3 — SonarCloud
  #
  # Estrategia: mvn verify sonar:sonar por cada servicio Java.
  # Esto compila + corre tests + escanea en UN solo paso, lo que garantiza
  # que sonar.java.libraries y sonar.java.binaries estén disponibles y
  # elimina el warning "Dependencies/libraries were not provided".
  #
  # Depende de que ambos jobs anteriores pasen primero.
  # ══════════════════════════════════════════════════════════════════════════
  sonar:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    needs: [build_test_java, build_test_node]

    steps:
      # ── 1. Checkout con historial completo (requerido por Sonar) ──────────
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. JDK 17 + cache Maven ───────────────────────────────────────────
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # ── 3. Levantar BDs para servicios Fase 1 ────────────────────────────
      - name: Levantar BD ms-flota
        working-directory: Backend/ms-flota
        run: docker compose up -d mysql-flota

      - name: Levantar BD ms-taller
        working-directory: Backend/ms-taller
        run: docker compose up -d mysql-taller

      - name: Esperar que las BDs estén listas
        run: |
          echo "Esperando que mysql-flota esté healthy..."
          for i in {1..30}; do
            docker compose -f Backend/ms-flota/docker-compose.yml ps mysql-flota \
              | grep "healthy" && echo "mysql-flota listo" && break
            sleep 5
          done
          echo "Esperando que mysql-taller esté healthy..."
          for i in {1..30}; do
            docker compose -f Backend/ms-taller/docker-compose.yml ps mysql-taller \
              | grep "healthy" && echo "mysql-taller listo" && break
            sleep 5
          done

      # ── 4. Permisos Maven Wrapper ─────────────────────────────────────────
      - name: Permisos Maven Wrapper
        run: |
          chmod +x Backend/ms-flota/mvnw
          chmod +x Backend/ms-taller/mvnw
          chmod +x Backend/ms-auth/mvnw
          chmod +x Backend/ms-clientes/mvnw
          chmod +x Backend/ms-pedidos/mvnw
          chmod +x Backend/ms-ruteo/mvnw

      # ── 5. ms-flota — verify + Sonar (MySQL real) ────────────────────────
      - name: SonarCloud — ms-flota
        working-directory: Backend/ms-flota
        run: |
          ./mvnw -B verify sonar:sonar \
            -Dsonar.projectKey=jazambrano21_LogiFlow-Proyecto-Integrador \
            -Dsonar.organization=jazambrano21 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dspring.datasource.url="jdbc:mysql://localhost:3307/ms_flota_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true" \
            -Dspring.datasource.username=root \
            -Dspring.datasource.password=root \
            -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver \
            -Dspring.jpa.hibernate.ddl-auto=create-drop
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ── 6. ms-taller — verify + Sonar (MySQL real) ───────────────────────
      - name: SonarCloud — ms-taller
        working-directory: Backend/ms-taller
        run: |
          ./mvnw -B verify sonar:sonar \
            -Dsonar.projectKey=jazambrano21_LogiFlow-Proyecto-Integrador \
            -Dsonar.organization=jazambrano21 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dspring.datasource.url="jdbc:mysql://localhost:3309/logiflow_taller?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true" \
            -Dspring.datasource.username=root \
            -Dspring.datasource.password=root \
            -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver \
            -Dspring.jpa.hibernate.ddl-auto=create-drop
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ── 7. ms-auth — verify + Sonar (H2, perfil test) ────────────────────
      - name: SonarCloud — ms-auth
        working-directory: Backend/ms-auth
        run: |
          ./mvnw -B verify sonar:sonar \
            -Dsonar.projectKey=jazambrano21_LogiFlow-Proyecto-Integrador \
            -Dsonar.organization=jazambrano21 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dspring.profiles.active=test
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JWT_SECRET: test-secret-key-for-ci-pipeline-32chars

      # ── 8. ms-clientes — verify + Sonar (H2, perfil test) ────────────────
      - name: SonarCloud — ms-clientes
        working-directory: Backend/ms-clientes
        run: |
          ./mvnw -B verify sonar:sonar \
            -Dsonar.projectKey=jazambrano21_LogiFlow-Proyecto-Integrador \
            -Dsonar.organization=jazambrano21 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dspring.profiles.active=test
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JWT_SECRET: test-secret-key-for-ci-pipeline-32chars

      # ── 9. ms-pedidos — verify + Sonar (H2, perfil test) ─────────────────
      - name: SonarCloud — ms-pedidos
        working-directory: Backend/ms-pedidos
        run: |
          ./mvnw -B verify sonar:sonar \
            -Dsonar.projectKey=jazambrano21_LogiFlow-Proyecto-Integrador \
            -Dsonar.organization=jazambrano21 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dspring.profiles.active=test
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JWT_SECRET: test-secret-key-for-ci-pipeline-32chars

      # ── 10. ms-ruteo — verify + Sonar (H2, perfil test) ──────────────────
      - name: SonarCloud — ms-ruteo
        working-directory: Backend/ms-ruteo
        run: |
          ./mvnw -B verify sonar:sonar \
            -Dsonar.projectKey=jazambrano21_LogiFlow-Proyecto-Integrador \
            -Dsonar.organization=jazambrano21 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dspring.profiles.active=test
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JWT_SECRET: test-secret-key-for-ci-pipeline-32chars

      # ── 11. Node.js — scanner SonarCloud genérico ────────────────────────
      # ms-seguimiento y graphql-gateway no tienen bytecode Java,
      # el scanner genérico es correcto para JS.
      - name: Configurar Node.js 20 (para análisis JS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias ms-seguimiento
        working-directory: Backend/ms-seguimiento
        run: npm ci --omit=dev

      - name: Instalar dependencias graphql-gateway
        working-directory: Backend/graphql-gateway
        run: npm ci --omit=dev

      - name: SonarCloud — Node.js (ms-seguimiento + graphql-gateway)
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=jazambrano21_LogiFlow-Proyecto-Integrador
            -Dsonar.organization=jazambrano21
            -Dsonar.sources=Backend/ms-seguimiento/src,Backend/graphql-gateway/src
            -Dsonar.exclusions=**/node_modules/**,**/target/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # ── 12. Limpieza de containers ────────────────────────────────────────
      - name: Bajar containers
        if: always()
        run: |
          docker compose -f Backend/ms-flota/docker-compose.yml down -v || true
          docker compose -f Backend/ms-taller/docker-compose.yml down -v || true

      # ── 13. Notificaciones Telegram ───────────────────────────────────────
      - name: Notificar éxito en Telegram
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
              \"text\": \"✅ LogiFlow CI Exitoso\\n\\nRama: ${{ github.ref_name }}\\nCommit: ${{ github.sha }}\\n\\n📊 SonarCloud: https://sonarcloud.io/project/overview?id=jazambrano21_LogiFlow-Proyecto-Integrador\\n🔗 Pipeline: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"parse_mode\": \"HTML\"
            }"

      - name: Notificar fallo en Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ secrets.TELEGRAM_CHAT_ID }}\",
              \"text\": \"❌ LogiFlow CI Falló\\n\\nRama: ${{ github.ref_name }}\\nCommit: ${{ github.sha }}\\n\\n🔗 Pipeline: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"parse_mode\": \"HTML\"
            }"
